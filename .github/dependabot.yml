version: 2
updates:
  # Python dependencies (pyproject.toml at the repo root).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        # The PyPI publish action receives the trusted-publishing OIDC token
        # and is never exercised by CI, so it always arrives as its own PR
        # for human review instead of riding along in the group.
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
          - "pypa/gh-action-pypi-publish"
