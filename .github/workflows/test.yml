name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # libfte is pure Python, so one macOS job covers platform differences.
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: '3.14'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest -v --cov=fte

  # Aggregate gate: single deterministic check for branch protection. It depends
  # on every matrix leg of `test`, so requiring only this context gates on the
  # whole matrix while surviving changes to the OS/Python combinations.
  all-tests:
    name: All tests passed
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all test matrix jobs succeeded
        if: ${{ needs.test.result != 'success' }}
        run: |
          echo "Test matrix result: ${{ needs.test.result }}"
          exit 1
      - name: Success
        run: echo "All test matrix jobs passed."
