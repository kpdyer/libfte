name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-pure-python:
    name: Pure Python (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies (pure Python)
        run: |
          python -m pip install --upgrade pip
          FTE_BUILD_NATIVE=0 pip install -e ".[dev]"

      - name: Run tests (pure Python)
        run: |
          python -m pytest fte/tests/ -v

      - name: Verify using pure Python
        run: |
          python -c "from fte.dfa import using_native; assert not using_native(), 'Should be using pure Python'"

  test-native:
    name: Native (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gmp

      - name: Install Python dependencies (with native extension)
        run: |
          python -m pip install --upgrade pip
          FTE_BUILD_NATIVE=1 pip install -e ".[dev]"

      - name: Run tests (native)
        env:
          FTE_USE_NATIVE: '1'
        run: |
          python -m pytest fte/tests/ -v --cov=fte --cov-report=xml

      - name: Verify using native extension
        env:
          FTE_USE_NATIVE: '1'
        run: |
          python -c "from fte.dfa import using_native; assert using_native(), 'Should be using native extension'"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
