[build-system]
# >=64 for PEP 660 editable installs without a setup.py shim.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fte"
dynamic = ["version"]
description = "Format-Transforming Encryption"
readme = "README_PYPI.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kevin P. Dyer", email = "kpdyer@gmail.com"}
]
keywords = ["cryptography", "encryption", "regex", "DFA", "FTE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pycryptodome>=3.9.0",
    "regex2dfa>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/kpdyer/libfte"
Repository = "https://github.com/kpdyer/libfte"
Documentation = "https://github.com/kpdyer/libfte#readme"

[tool.setuptools.dynamic]
version = {file = "fte/_version.txt"}

[tool.setuptools.packages.find]
# Tests live in the top-level tests/ directory, outside the fte package, so
# nothing extra ships in wheels.
include = ["fte*"]

[tool.setuptools.package-data]
fte = ["_version.txt", "py.typed", "formats/regex/README.md"]

# All tests live in the top-level tests/ directory.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fte"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "raise AssertionError",
    '^\s*\.\.\.\s*$',
]
