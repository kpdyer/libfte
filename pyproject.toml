[build-system]
# >=77 for PEP 639 license metadata (license = "MIT" + license-files); that
# also covers PEP 660 editable installs without a setup.py shim (>=64).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fte"
dynamic = ["version"]
description = "Format-Transforming Encryption"
readme = "README_PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Kevin P. Dyer", email = "kpdyer@gmail.com"}
]
keywords = [
    "cryptography", "encryption", "regex", "DFA", "FTE", "FPE",
    "format-preserving",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=41.0",
    "regex2dfa>=0.2.0",
    # The built-in cipher="ff1" (format-preserving, deterministic,
    # zero-expansion) is libffx's FF1; pure Python.
    "libffx>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/kpdyer/libfte"
Repository = "https://github.com/kpdyer/libfte"
Documentation = "https://github.com/kpdyer/libfte#readme"

[tool.setuptools.dynamic]
version = {file = "fte/_version.txt"}

[tool.setuptools.packages.find]
# Tests live in the top-level tests/ directory, outside the fte package, so
# nothing extra ships in wheels.
include = ["fte*"]

[tool.setuptools.package-data]
fte = ["_version.txt", "py.typed", "formats/regex/README.md"]

# All tests live in the top-level tests/ directory.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fte"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "raise AssertionError",
    '^\s*\.\.\.\s*$',
]
